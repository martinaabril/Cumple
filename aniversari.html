<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Per a tu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,600&display=swap">
<style>
:root{--ink:#fff7ee;--red:#b3001b}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#go{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:.7em 2.2em;font:italic 600 clamp(1.5rem,5vw,2.2rem)/1 "Cormorant Garamond",Georgia,serif;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid rgba(255,247,238,.55);border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 2.8s ease,box-shadow .4s,background .4s;box-shadow:0 0 30px rgba(255,247,238,.12);letter-spacing:.06em}
#go.on{opacity:1;pointer-events:auto}
#go:hover{background:rgba(255,255,255,.1);box-shadow:0 0 45px rgba(255,247,238,.3)}
#go:focus-visible{outline:2px solid #fff;outline-offset:6px}
#go.off{opacity:0;pointer-events:none;transition:opacity .9s ease}
#letter{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 7vh) 7vw 0;text-align:center;pointer-events:none;text-shadow:0 2px 18px rgba(80,0,10,.55);transition:opacity 1.6s ease}
#letter.out{opacity:0}
#letter h1{font-style:italic;font-weight:600;font-size:clamp(2.2rem,8vw,4.6rem);line-height:1.1;margin-bottom:.5em}
#letter p{font-size:clamp(1.2rem,3.2vw,1.75rem);line-height:1.4;max-width:30em;margin:0 auto .7em}
#letter .sig{font-style:italic;margin-top:1em}
.rev{opacity:0;filter:blur(8px);transition:opacity 2.2s ease,filter 2.2s ease}
.rev.show{opacity:1;filter:blur(0)}
@media (prefers-reduced-motion:reduce){.rev{transition-duration:.01s}}

#stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1400px;pointer-events:none}
#tilt{transform-style:preserve-3d;transition:transform .25s ease-out}
#polaroid{position:relative;width:min(90vw,calc((100vh - 190px) * 16 / 9 + 28px));background:#fffaf2;padding:14px 14px 18px;border-radius:3px;box-shadow:0 30px 80px rgba(40,0,8,.55),0 0 100px rgba(255,214,170,.4);opacity:0;transform:translateY(80px) rotateX(40deg) rotateZ(-8deg) scale(.5);filter:blur(12px)}
#polaroid.in{animation:land 2.8s cubic-bezier(.2,.9,.25,1) forwards,glow 4s ease-in-out 2.8s infinite alternate}
@keyframes land{to{opacity:1;transform:translateY(0) rotateX(0) rotateZ(-1.2deg) scale(1);filter:blur(0)}}
@keyframes glow{from{box-shadow:0 30px 80px rgba(40,0,8,.55),0 0 90px rgba(255,214,170,.3)}to{box-shadow:0 30px 80px rgba(40,0,8,.55),0 0 150px rgba(255,200,150,.6)}}
.ph{position:relative;overflow:hidden;background:#222}
.ph img{display:block;width:100%;height:auto;animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,-1%)}}
.shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);transform:translateX(-130%)}
#polaroid.in .shine{animation:sweep 7s ease-in-out 2.4s infinite}
@keyframes sweep{0%{transform:translateX(-130%)}28%,100%{transform:translateX(130%)}}
#polaroid p{margin-top:10px;text-align:center;font-style:italic;font-weight:600;color:#5a0b17;font-size:clamp(1.1rem,2.8vw,1.7rem)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash 1.8s ease-out}
@keyframes flash{0%{opacity:0}10%{opacity:.9}100%{opacity:0}}
</style>
</head>

<div id="flash"></div>

<script>
/* ===== TEXT PERSONALITZABLE: canvia només això ===== */
const TEXT = {
  titol: "Feliçitats Papa",
  linies: [
    "Gràcies per ser el millor pare del món.",
    "Que tinguis un molt bon dia d'aniversari.",
    "T’estimem molt."
  ],
  signatura: "Amb tot l’amor",
  peu: "Els millors moments amb tu"
};
/* =================================================== */

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const go = document.getElementById("go"), letter = document.getElementById("letter");
let W, H, DPR;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeBack = p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", () => { resize(); makeFlowers(); });
resize();

/* Estrelles */
const stars = Array.from({ length: 240 }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.3 + 0.3,
  s: Math.random() * 2 + 0.6,
  p: Math.random() * 6.28,
  d: (Math.random() - 0.5) * 0.004
}));
function drawStars(t, a) {
  if (a <= 0) return;
  for (const s of stars) {
    s.x = (s.x + s.d * 0.01 + 1) % 1;
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.s + s.p));
    ctx.globalAlpha = tw * a;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* Cors */
const heartColors = ["#e0112b", "#ff3b5c", "#c1121f", "#ff5c7a", "#a4001a", "#ff8fa3"];
let hearts = [];
function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * 0.4);
  ctx.bezierCurveTo(-s * 0.9, -s * 0.1, -s * 0.5, -s * 0.7, 0, -s * 0.25);
  ctx.bezierCurveTo(s * 0.5, -s * 0.7, s * 0.9, -s * 0.1, 0, s * 0.4);
  ctx.closePath();
}

/* Flors */
const petalSets = [["#ffd1dc", "#ff8fab"], ["#ffffff", "#ffe3ea"], ["#ffe08a", "#ffb703"], ["#ffb3c1", "#ff5d8f"], ["#ffd6a5", "#ff9e5e"]];
let flowers = [];
function makeFlowers() {
  const n = Math.round(clamp(W / 42, 14, 32));
  flowers = Array.from({ length: n }, (_, i) => {
    const set = petalSets[Math.floor(Math.random() * petalSets.length)];
    return {
      x: W * (0.04 + 0.92 * (i + Math.random() * 0.6) / n),
      y: H * (0.58 + Math.random() * 0.34),
      r: Math.min(W, H) * (0.05 + Math.random() * 0.045),
      delay: Math.random() * 6,
      k: 5 + Math.floor(Math.random() * 4),
      c1: set[0], c2: set[1],
      rot: Math.random() * 6.28, ph: Math.random() * 6.28
    };
  });
}
makeFlowers();

function drawFlowers(t) {
  for (const f of flowers) {
    const p1 = clamp((t - f.delay) / 1.4);
    if (p1 <= 0) continue;
    const top = (H + 12) - (H + 12 - f.y) * easeOut(p1);
    ctx.strokeStyle = "#2d6a4f"; ctx.lineWidth = Math.max(2, f.r * 0.1); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(f.x, H + 12); ctx.lineTo(f.x, top); ctx.stroke();
  }
  for (const f of flowers) {
    const p2 = clamp((t - f.delay - 1.1) / 1.6);
    if (p2 <= 0) continue;
    const r = f.r * easeBack(p2);
    const sway = Math.sin(t * 0.8 + f.ph) * 0.06;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot + sway + p2 * 0.8);
    for (let i = 0; i < f.k; i++) {
      ctx.rotate(6.283 / f.k);
      const g = ctx.createLinearGradient(0, 0, r, 0);
      g.addColorStop(0, f.c2); g.addColorStop(1, f.c1);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(r * 0.55, 0, r * 0.55, r * 0.3, 0, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = "#ffb703";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.26, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#e07a00";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.12, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}

/* Text */
function buildLetter() {
  const items = [["h1", TEXT.titol], ...TEXT.linies.map(l => ["p", l]), ["p", TEXT.signatura, "sig"]];
  items.forEach(([tag, txt, cls], i) => {
    const el = document.createElement(tag);
    el.textContent = txt;
    el.className = "rev" + (cls ? " " + cls : "");
    el.style.transitionDelay = (i * 1.6) + "s";
    letter.appendChild(el);
  });
}
buildLetter();
function revealLetter() { letter.querySelectorAll(".rev").forEach(e => e.classList.add("show")); }

/* Foto final */
const pol = document.getElementById("polaroid"), tilt = document.getElementById("tilt"), flash = document.getElementById("flash");
document.getElementById("peu").textContent = TEXT.peu;
let photoShown = false, risingOn = false, rise = [], riseAcc = 0;
const riseColors = ["#ffd1dc", "#ff8fa3", "#ffffff", "#ffb3c1", "#ffe3ea"];
function showPhoto() {
  letter.classList.add("out");
  setTimeout(() => { flash.classList.add("go"); pol.classList.add("in"); risingOn = true; }, 1500);
}
function drawRising(dt) {
  if (!risingOn) return;
  riseAcc += dt * 5;
  while (riseAcc >= 1) {
    riseAcc--;
    rise.push({ x: Math.random() * W, y: H + 30, s: 8 + Math.random() * 18, v: 50 + Math.random() * 90, ph: Math.random() * 6.28, c: riseColors[Math.floor(Math.random() * riseColors.length)] });
  }
  for (const h of rise) {
    h.y -= h.v * dt;
    ctx.save();
    ctx.globalAlpha = 0.8 * clamp(h.y / (H * 0.25));
    ctx.translate(h.x + Math.sin(h.y / 40 + h.ph) * 14, h.y);
    ctx.fillStyle = h.c;
    heartPath(h.s); ctx.fill();
    ctx.restore();
  }
  rise = rise.filter(h => h.y > -40);
}
addEventListener("pointermove", ev => {
  if (!photoShown) return;
  const x = ev.clientX / W - 0.5, y = ev.clientY / H - 0.5;
  tilt.style.transform = "rotateY(" + (x * 12) + "deg) rotateX(" + (-y * 9) + "deg)";
});
addEventListener("pointerleave", () => { tilt.style.transform = ""; });

/* Línia de temps */
let started = false, T0 = 0, textShown = false, spawnAcc = 0, last = performance.now();
const RED = "#b3001b";

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  ctx.globalAlpha = 1; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  if (!started) { drawStars(t, 1); requestAnimationFrame(frame); return; }

  const e = t - T0;
  const redA = clamp((e - 6.2) / 2.6);
  drawStars(t, 1 - redA);

  if (e < 9.6) {
    if (e > 0.4 && e < 5.6) {
      spawnAcc += dt * 32;
      while (spawnAcc >= 1) {
        spawnAcc--;
        hearts.push({ x: Math.random() * W, y: Math.random() * H, born: e, rot: (Math.random() - 0.5) * 0.7, c: heartColors[Math.floor(Math.random() * heartColors.length)] });
      }
    }
    for (const h of hearts) {
      const age = e - h.born;
      const size = 5 * Math.exp(age * 1.0);
      ctx.save();
      ctx.globalAlpha = clamp(age / 1.3) * 0.9;
      ctx.translate(h.x, h.y); ctx.rotate(h.rot);
      ctx.fillStyle = h.c;
      heartPath(size); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = redA; ctx.fillStyle = RED; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  } else {
    hearts = [];
    ctx.fillStyle = RED; ctx.fillRect(0, 0, W, H);
    drawFlowers(e - 9.8);
    drawRising(dt);
    if (!textShown && e > 13) { textShown = true; revealLetter(); }
    if (!photoShown && e > 23.5) { photoShown = true; showPhoto(); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

setTimeout(() => go.classList.add("on"), 2500);
go.addEventListener("click", () => {
  go.classList.remove("on"); go.classList.add("off");
  T0 = performance.now() / 1000; started = true;
});
</script>
</body>
